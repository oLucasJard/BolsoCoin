<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Ícones Placeholder - BolsoCoin</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(255, 209, 0, 0.1);
        }
        h1 {
            color: #FFD100;
            margin-bottom: 10px;
        }
        p {
            color: #999;
            margin-bottom: 30px;
        }
        button {
            background: #FFD100;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:active {
            transform: scale(0.98);
        }
        .log {
            margin-top: 20px;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .log.active {
            display: block;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
        }
        .log-item.success {
            color: #4ade80;
        }
        .log-item.error {
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Gerador de Ícones Placeholder</h1>
        <p>Este script gera ícones temporários para o BolsoCoin PWA. Clique no botão abaixo para gerar automaticamente todos os tamanhos necessários.</p>
        
        <button onclick="generateIcons()">Gerar Ícones Placeholder</button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            logEl.classList.add('active');
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(item);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function createIcon(size) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Background amarelo
                ctx.fillStyle = '#FFD100';
                ctx.fillRect(0, 0, size, size);

                // Texto (emoji ou $)
                ctx.fillStyle = '#000000';
                ctx.font = `bold ${size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💰', size / 2, size / 2);

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}x${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                    resolve();
                }, 'image/png');
            });
        }

        async function generateIcons() {
            log('Iniciando geração de ícones...', 'info');
            
            for (const size of sizes) {
                try {
                    await createIcon(size);
                    log(`✓ Ícone ${size}x${size} gerado com sucesso!`, 'success');
                    await new Promise(resolve => setTimeout(resolve, 300));
                } catch (error) {
                    log(`✗ Erro ao gerar ícone ${size}x${size}: ${error.message}`, 'error');
                }
            }
            
            log('---', 'info');
            log('✅ Processo concluído!', 'success');
            log('📁 Mova os arquivos baixados para a pasta public/', 'info');
        }
    </script>
</body>
</html>
